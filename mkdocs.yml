site_name: "Christopher KRAGBE | Portfolio DevOps & Doc Technique"
site_description: "Portfolio technique Docs-as-Code de Christopher KRAGBE : Administration Systèmes, Réseaux, Sécurité & Ingénierie DevOps"
site_author: "Christopher KRAGBE"
site_url: "https://chrskrgb.github.io/"

# Dépôt GitHub lié au projet
repo_name: "chrskrgb/chrskrgb.github.io"
repo_url: "https://github.com/chrskrgb/chrskrgb.github.io"
edit_uri: "edit/main/docs/"

# Configuration du thème Material for MkDocs
theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    # Mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
    # Mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
  icon:
    logo: material/console-line
    repo: fontawesome/brands/github

# Extensions Markdown
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Feuilles de style et scripts personnalisés
extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chrskrgb
      name: GitHub (chrskrgb)
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/chrs-krgb
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:kragbe.christopher@pm.me
      name: Email

# Plugins
plugins:
  - search

# ==============================================================================
